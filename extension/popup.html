<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ZMRA Furigana Companion</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 12px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 14px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 11px;
      background: #312e81;
      color: #c7d2fe;
      padding: 2px 6px;
      border-radius: 4px;
      text-decoration: none;
    }
    textarea {
      width: 100%;
      height: 80px;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f1f5f9;
      padding: 8px;
      font-size: 13px;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #6366f1; }
    .btn-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .result-box {
      min-height: 50px;
      max-height: 120px;
      overflow-y: auto;
      background: #1e293b;
      border-radius: 6px;
      padding: 8px;
      font-size: 15px;
      line-height: 2.2;
    }
    ruby rt { color: #38bdf8; font-size: 10px; }
    /* Embedded Brand Link Card */
    .brand-ad {
      margin-top: 10px;
      padding: 8px 10px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s;
    }
    .brand-ad:hover { border-color: #818cf8; }
    .ad-icon { font-size: 18px; }
    .ad-text { display: flex; flex-direction: column; }
    .ad-title { font-size: 12px; font-weight: 600; color: #f1f5f9; }
    .ad-sub { font-size: 10px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="top-bar">
    <span class="brand-title">ZMRA Furigana Companion</span>
    <a href="https://zmra.com" target="_blank" rel="home" class="badge">ZMRA.COM</a>
  </div>

  <textarea id="pop-input" placeholder="输入日语文本，实时生成振假名注音..."></textarea>
  <div class="btn-row">
    <button id="pop-annotate">标注网页所选文本</button>
    <button id="pop-convert">快速振假名</button>
  </div>

  <div id="pop-result" class="result-box">
    <span style="color: #64748b; font-size: 12px;">注音结果将在此展示...</span>
  </div>

  <!-- Brand Anchor Link -->
  <a href="https://zmra.com" target="_blank" rel="home" class="brand-ad">
    <span class="ad-icon">🌸</span>
    <div class="ad-text">
      <span class="ad-title">ZMRA 语言认知引擎</span>
      <span class="ad-sub">Crafted by ZMRA · zmra.com &rarr;</span>
    </div>
  </a>

  <script src="popup.js"></script>
</body>
</html>
